<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERBO MASTER - Analisi Grammaticale dei Verbi</title>
  <!-- Tailwind CSS per styling moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome per icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#3B82F6',
              purple: '#8B5CF6',
              orange: '#F97316',
              green: '#10B981',
              dark: '#0F172A',
              card: '#1E293B'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      min-height: 100vh;
    }

    .font-display {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .glow-purple {
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.35);
    }

    .glow-orange {
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.35);
    }

    .custom-select {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      transition: all 0.2s ease;
    }

    .custom-select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
      outline: none;
    }

    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between">

  <header class="max-w-4xl mx-auto w-full mb-6">
    <div class="glass-card rounded-3xl p-4 sm:p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      
      <!-- LOGO -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-purple to-brand-blue flex items-center justify-center text-white text-2xl shadow-lg glow-purple">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold font-display tracking-wider bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 bg-clip-text text-transparent">
            VERBO MASTER
          </h1>
          <p class="text-xs text-slate-400 font-medium">Palestra di Analisi Grammaticale per la Scuola Secondaria</p>
        </div>
      </div>

      <!-- SELETTORE MODALITÀ -->
      <div class="w-full sm:w-auto">
        <label for="mode-filter" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Modalità Allenamento</label>
        <select id="mode-filter" onchange="resetGame()" class="custom-select w-full font-semibold py-2 px-3 rounded-xl text-sm">
          <option value="all">🌟 Tutti i Verbi (+2500 Combinazioni)</option>
          <option value="servili">🔍 Servili e Fraseologici</option>
          <option value="passivi">🔄 Passivi e Riflessivi</option>
          <option value="composti">⏳ Tempi Composti e Indefiniti</option>
        </select>
      </div>

    </div>

    <!-- TABELLONE PUNTEGGI & GAMIFICATION -->
    <div class="grid grid-cols-3 gap-3 mt-4 text-center">
      <div class="glass-card p-3 rounded-2xl border border-slate-700">
        <span class="block text-xs font-bold uppercase text-slate-400">Punti</span>
        <span id="score-display" class="text-2xl sm:text-3xl font-extrabold font-display text-brand-blue">0</span>
      </div>
      <div class="glass-card p-3 rounded-2xl border border-slate-700">
        <span class="block text-xs font-bold uppercase text-slate-400">Serie</span>
        <span id="streak-display" class="text-2xl sm:text-3xl font-extrabold font-display text-brand-orange">🔥 0</span>
      </div>
      <div class="glass-card p-3 rounded-2xl border border-slate-700">
        <span class="block text-xs font-bold uppercase text-slate-400">Livello</span>
        <span id="level-display" class="text-xl sm:text-2xl font-bold font-display text-brand-green">🌱 Novizio</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full flex-grow mb-6">
    
    <div class="glass-card rounded-3xl p-5 sm:p-8 border border-slate-700 transition-all duration-300">
      
      <!-- SCHEDA VERBO (SENZA INDIZI VISIVI O SUGGERIMENTI) -->
      <div class="text-center mb-8">
        <div class="inline-block px-4 py-1.5 bg-slate-800 text-slate-400 rounded-full text-xs font-bold uppercase tracking-widest mb-3 border border-slate-700">
          Esercizio <span id="current-step">1</span> di <span id="total-steps">10</span>
        </div>
        
        <p id="sentence-text" class="text-lg sm:text-2xl font-medium text-slate-200 leading-relaxed mb-5">
          Caricamento frase...
        </p>
        
        <div class="inline-block px-8 py-4 bg-gradient-to-r from-brand-purple to-brand-blue text-white font-extrabold text-2xl sm:text-3xl rounded-2xl shadow-xl glow-purple tracking-wide font-display">
          <span id="target-verb-text">VERBO</span>
        </div>
      </div>

      <form id="analysis-form" onsubmit="checkAnswer(event)" class="space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          
          <!-- Coniugazione -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
            <label for="conjugation" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-list-ol text-brand-purple mr-1"></i> Coniugazione
            </label>
            <select id="conjugation" required class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="1a">1ª coniugazione (-are)</option>
              <option value="2a">2ª coniugazione (-ere)</option>
              <option value="3a">3ª coniugazione (-ire)</option>
              <option value="propria">Coniugazione propria (essere/avere)</option>
            </select>
          </div>

          <!-- Modo -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
            <label for="mode" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-compass text-brand-blue mr-1"></i> Modo
            </label>
            <select id="mode" required onchange="handleModeChange()" class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="indicativo">Indicativo</option>
              <option value="congiuntivo">Congiuntivo</option>
              <option value="condizionale">Condizionale</option>
              <option value="imperativo">Imperativo</option>
              <option value="infinito">Infinito</option>
              <option value="participio">Participio</option>
              <option value="gerundio">Gerundio</option>
            </select>
          </div>

          <!-- Tempo -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
            <label for="tense" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-clock text-brand-orange mr-1"></i> Tempo
            </label>
            <select id="tense" required class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="presente">Presente</option>
              <option value="imperfetto">Imperfetto</option>
              <option value="passato remoto">Passato remoto</option>
              <option value="futuro semplice">Futuro semplice</option>
              <option value="passato prossimo">Passato prossimo</option>
              <option value="trapassato prossimo">Trapassato prossimo</option>
              <option value="trapassato remoto">Trapassato remoto</option>
              <option value="futuro anteriore">Futuro anteriore</option>
              <option value="passato">Passato</option>
            </select>
          </div>

          <!-- Persona -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
            <label for="person" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-user text-brand-green mr-1"></i> Persona
            </label>
            <select id="person" required class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="1s">1ª pers. singolare (io)</option>
              <option value="2s">2ª pers. singolare (tu)</option>
              <option value="3s">3ª pers. singolare (egli/ella)</option>
              <option value="1p">1ª pers. plurale (noi)</option>
              <option value="2p">2ª pers. plurale (voi)</option>
              <option value="3p">3ª pers. plurale (essi/esse)</option>
              <option value="nessuna">Nessuna (Modo indefinito)</option>
            </select>
          </div>

          <!-- Transitività -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
            <label for="transitivity" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-right-left text-brand-purple mr-1"></i> Transitività
            </label>
            <select id="transitivity" required class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="transitivo">Transitivo</option>
              <option value="intransitivo">Intransitivo</option>
            </select>
          </div>

          <!-- Forma -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800">
            <label for="voice" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-shield-halved text-brand-blue mr-1"></i> Forma
            </label>
            <select id="voice" required class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="attiva">Attiva</option>
              <option value="passiva">Passiva</option>
              <option value="riflessiva">Riflessiva</option>
            </select>
          </div>

          <!-- Funzione -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 sm:col-span-2">
            <label for="function" class="block text-xs font-bold text-slate-400 uppercase mb-2">
              <i class="fa-solid fa-star text-brand-orange mr-1"></i> Funzione / Uso Speciale
            </label>
            <select id="function" required class="custom-select w-full py-2.5 px-3 rounded-xl text-sm">
              <option value="">Seleziona...</option>
              <option value="proprio">Uso proprio / Significato proprio</option>
              <option value="servile">Servile (Dovere, Potere, Volere, Sapere...)</option>
              <option value="fraseologico">Fraseologico (Stare per, Cominciare a, Continuare a...)</option>
              <option value="ausiliare">Ausiliare (Essere / Avere nei tempi composti)</option>
            </select>
          </div>

        </div>

        <!-- PULSANTI -->
        <div class="pt-2 flex flex-col sm:flex-row gap-3">
          <button type="submit" id="btn-submit" class="w-full py-4 bg-gradient-to-r from-brand-orange to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-extrabold text-lg rounded-2xl shadow-lg glow-orange transform active:scale-95 transition font-display tracking-wider">
            <i class="fa-solid fa-check-circle mr-2"></i> VERIFICA RISPOSTA
          </button>
          <button type="button" id="btn-next" onclick="nextQuestion()" class="hidden w-full py-4 bg-gradient-to-r from-brand-blue to-brand-purple hover:from-blue-600 hover:to-purple-700 text-white font-extrabold text-lg rounded-2xl shadow-lg glow-purple transform active:scale-95 transition font-display tracking-wider">
            PROSSIMO VERBO <i class="fa-solid fa-arrow-right ml-2"></i>
          </button>
        </div>

      </form>

      <div id="feedback-panel" class="hidden mt-6 p-5 rounded-2xl border transition-all duration-300">
        <div class="flex items-start gap-4">
          <div id="feedback-icon" class="text-3xl"></div>
          <div class="flex-grow">
            <h3 id="feedback-title" class="text-lg font-bold mb-2"></h3>
            <div id="feedback-body" class="text-sm space-y-1"></div>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="text-center text-xs text-slate-500 py-3">
    VERBO MASTER • Generatore Linguistico Esteso per la Scuola Secondaria di I Grado
  </footer>

  <script>
    /*
      ===================================================================
      DATABASE LINGUISTICO RICCO E GENERATORE COMBINATORIO (+2500 VERBI)
      ===================================================================
    */

    // Soggetti per l'accordo della persona
    const subjects = [
      { text: "Io", p: "1s" },
      { text: "Tu", p: "2s" },
      { text: "Luca", p: "3s" },
      { text: "Maria", p: "3s" },
      { text: "Il professore", p: "3s" },
      { text: "Noi", p: "1p" },
      { text: "Tutti noi", p: "1p" },
      { text: "Voi studenti", p: "2p" },
      { text: "I ragazzi", p: "3p" },
      { text: "Gli atleti", p: "3p" }
    ];

    // MATRICE BASE DEI VERBI (Sviluppa migliaia di combinazioni)
    const verbBaseDatabase = [
      // 1ª CONIUGAZIONE (-ARE)
      {
        inf: "mangiare", conj: "1a", trans: "transitivo", obj: ["una mela croccante", "un delizioso gelato", "la cena in famiglia"],
        forms: {
          "1s": { pres: "mangio", imp: "mangiavo", passRem: "mangiai", futSimp: "mangerò", passPross: "ho mangiato", trapPross: "avevo mangiato", futAnt: "avrò mangiato", congPres: "mangi", condPres: "mangerei" },
          "2s": { pres: "mangi", imp: "mangiavi", passRem: "mangiasti", futSimp: "mangerai", passPross: "hai mangiato", trapPross: "avevi mangiato", futAnt: "avrai mangiato", congPres: "mangi", condPres: "mangeresti" },
          "3s": { pres: "mangia", imp: "mangiava", passRem: "mangiò", futSimp: "mangerà", passPross: "ha mangiato", trapPross: "aveva mangiato", futAnt: "avrà mangiato", congPres: "mangi", condPres: "mangerebbe" },
          "1p": { pres: "mangiamo", imp: "mangiavamo", passRem: "mangiammo", futSimp: "mangeremo", passPross: "abbiamo mangiato", trapPross: "avevamo mangiato", futAnt: "avremo mangiato", congPres: "mangiamo", condPres: "mangeremmo" },
          "2p": { pres: "mangiate", imp: "mangiavate", passRem: "mangiaste", futSimp: "mangerete", passPross: "avete mangiato", trapPross: "avevate mangiato", futAnt: "avrete mangiato", congPres: "mangiate", condPres: "mangereste" },
          "3p": { pres: "mangiano", imp: "mangiavano", passRem: "mangiarono", futSimp: "mangeranno", passPross: "hanno mangiato", trapPross: "avevano mangiato", futAnt: "avranno mangiato", congPres: "mangino", condPres: "mangerebbero" }
        }
      },
      {
        inf: "studiare", conj: "1a", trans: "transitivo", obj: ["storia della letteratura", "la mappa concettuale", "per la verifica di domani"],
        forms: {
          "1s": { pres: "studio", imp: "studiavo", passRem: "studiai", futSimp: "studierò", passPross: "ho studiato", trapPross: "avevo studiato", futAnt: "avrò studiato", congPres: "studi", condPres: "studierei" },
          "2s": { pres: "studi", imp: "studiavi", passRem: "studiasti", futSimp: "studierai", passPross: "hai studiato", trapPross: "avevi studiato", futAnt: "avrai studiato", congPres: "studi", condPres: "studieresti" },
          "3s": { pres: "studia", imp: "studiava", passRem: "studiò", futSimp: "studierà", passPross: "ha studiato", trapPross: "aveva studiato", futAnt: "avrà studiato", congPres: "studi", condPres: "studierebbe" },
          "1p": { pres: "studiamo", imp: "studiavamo", passRem: "studiammo", futSimp: "studieremo", passPross: "abbiamo studiato", trapPross: "avevamo studiato", futAnt: "avremo studiato", congPres: "studiamo", condPres: "studieremmo" },
          "2p": { pres: "studiate", imp: "studiavate", passRem: "studiaste", futSimp: "studierete", passPross: "avete studiato", trapPross: "avevate studiato", futAnt: "avrete studiato", congPres: "studiate", condPres: "studiereste" },
          "3p": { pres: "studiano", imp: "studiavano", passRem: "studiarono", futSimp: "studieranno", passPross: "hanno studiato", trapPross: "avevano studiato", futAnt: "avranno studiato", congPres: "studino", condPres: "studierebbero" }
        }
      },
      {
        inf: "camminare", conj: "1a", trans: "intransitivo", obj: ["nel parco alberato", "lungo la riva del fiume", "a passo svelto in città"],
        forms: {
          "1s": { pres: "cammino", imp: "camminavo", passRem: "camminai", futSimp: "camminerò", passPross: "ho camminato", trapPross: "avevo camminato", futAnt: "avrò camminato", congPres: "cammini", condPres: "camminerei" },
          "2s": { pres: "cammini", imp: "camminavi", passRem: "camminasti", futSimp: "camminerai", passPross: "hai camminato", trapPross: "avevi camminato", futAnt: "avrai camminato", congPres: "cammini", condPres: "cammineresti" },
          "3s": { pres: "cammina", imp: "camminava", passRem: "camminò", futSimp: "camminerà", passPross: "ha camminato", trapPross: "aveva camminato", futAnt: "avrà camminato", congPres: "cammini", condPres: "camminerebbe" },
          "1p": { pres: "camminiamo", imp: "camminavamo", passRem: "camminammo", futSimp: "cammineremo", passPross: "abbiamo camminato", trapPross: "avevamo camminato", futAnt: "avremo camminato", congPres: "camminiamo", condPres: "cammineremmo" },
          "2p": { pres: "camminate", imp: "camminavate", passRem: "camminaste", futSimp: "camminerete", passPross: "avete camminato", trapPross: "avevate camminato", futAnt: "avrete camminato", congPres: "camminate", condPres: "camminereste" },
          "3p": { pres: "camminano", imp: "camminavano", passRem: "camminarono", futSimp: "cammineranno", passPross: "hanno camminato", trapPross: "avevano camminato", futAnt: "avranno camminato", congPres: "camminino", condPres: "camminerebbero" }
        }
      },

      // 2ª CONIUGAZIONE (-ERE)
      {
        inf: "leggere", conj: "2a", trans: "transitivo", obj: ["un romanzo di fantascienza", "il regolamento della scuola", "una poesia antica"],
        forms: {
          "1s": { pres: "leggo", imp: "leggevo", passRem: "lessi", futSimp: "leggerò", passPross: "ho letto", trapPross: "avevo letto", futAnt: "avrò letto", congPres: "legga", condPres: "leggerei" },
          "2s": { pres: "leggi", imp: "leggevi", passRem: "leggesti", futSimp: "leggerai", passPross: "hai letto", trapPross: "avevi letto", futAnt: "avrai letto", congPres: "legga", condPres: "leggeresti" },
          "3s": { pres: "legge", imp: "leggeva", passRem: "lesse", futSimp: "leggerà", passPross: "ha letto", trapPross: "aveva letto", futAnt: "avrà letto", congPres: "legga", condPres: "leggerebbe" },
          "1p": { pres: "leggiamo", imp: "leggevamo", passRem: "leggemmo", futSimp: "leggeremo", passPross: "abbiamo letto", trapPross: "avevamo letto", futAnt: "avremo letto", congPres: "leggiamo", condPres: "leggeremmo" },
          "2p": { pres: "leggete", imp: "leggevate", passRem: "leggeste", futSimp: "leggerete", passPross: "avete letto", trapPross: "avevate letto", futAnt: "avrete letto", congPres: "leggete", condPres: "leggereste" },
          "3p": { pres: "leggono", imp: "leggevano", passRem: "lessero", futSimp: "leggeranno", passPross: "hanno letto", trapPross: "avevano letto", futAnt: "avranno letto", congPres: "leggano", condPres: "leggerebbero" }
        }
      },
      {
        inf: "scrivere", conj: "2a", trans: "transitivo", obj: ["un saggio per il concorso", "un messaggio al gruppo", "gli appunti sul quaderno"],
        forms: {
          "1s": { pres: "scrivo", imp: "scrivevo", passRem: "scrissi", futSimp: "scriverò", passPross: "ho scritto", trapPross: "avevo scritto", futAnt: "avrò scritto", congPres: "scriva", condPres: "scriverei" },
          "2s": { pres: "scrivi", imp: "scrivevi", passRem: "scrivesti", futSimp: "scriverai", passPross: "hai scritto", trapPross: "avevi scritto", futAnt: "avrai scritto", congPres: "scriva", condPres: "scriveresti" },
          "3s": { pres: "scrive", imp: "scriveva", passRem: "scrisse", futSimp: "scriverà", passPross: "ha scritto", trapPross: "aveva scritto", futAnt: "avrà scritto", congPres: "scriva", condPres: "scrivereppe" },
          "1p": { pres: "scriviamo", imp: "scrivevamo", passRem: "scrivemmo", futSimp: "scriveremo", passPross: "abbiamo scritto", trapPross: "avevamo scritto", futAnt: "avremo scritto", congPres: "scriviamo", condPres: "scriveremmo" },
          "2p": { pres: "scrivete", imp: "scrivevate", passRem: "scriveste", futSimp: "scriverete", passPross: "avete scritto", trapPross: "avevate scritto", futAnt: "avrete scritto", congPres: "scrivete", condPres: "scrivereste" },
          "3p": { pres: "scrivono", imp: "scrivevano", passRem: "scrissero", futSimp: "scriveranno", passPross: "hanno scritto", trapPross: "avevano scritto", futAnt: "avranno scritto", congPres: "scrivano", condPres: "scriverebbero" }
        }
      },

      // 3ª CONIUGAZIONE (-IRE)
      {
        inf: "partire", conj: "3a", trans: "intransitivo", obj: ["per la vacanza in montagna", "con il primo treno dell'alba", "verso la nuova destinazione"],
        forms: {
          "1s": { pres: "parto", imp: "partivo", passRem: "partii", futSimp: "partirò", passPross: "sono partito", trapPross: "ero partito", futAnt: "sarò partito", congPres: "parta", condPres: "partirei" },
          "2s": { pres: "parti", imp: "partivi", passRem: "partisti", futSimp: "partirai", passPross: "sei partito", trapPross: "eri partito", futAnt: "sarai partito", congPres: "parta", condPres: "partiresti" },
          "3s": { pres: "parte", imp: "partiva", passRem: "partì", futSimp: "partirà", passPross: "è partito", trapPross: "era partito", futAnt: "sarà partito", congPres: "parta", condPres: "partirebbe" },
          "1p": { pres: "partiamo", imp: "partivamo", passRem: "partimmo", futSimp: "partiremo", passPross: "siamo partiti", trapPross: "eravamo partiti", futAnt: "saremo partiti", congPres: "partiamo", condPres: "partiremmo" },
          "2p": { pres: "partite", imp: "partivate", passRem: "partiste", futSimp: "partirete", passPross: "siete partiti", trapPross: "eravate partiti", futAnt: "sarete partiti", congPres: "partite", condPres: "partireste" },
          "3p": { pres: "partono", imp: "partivano", passRem: "partirono", futSimp: "partiranno", passPross: "sono partiti", trapPross: "erano partiti", futAnt: "saranno partiti", congPres: "partano", condPres: "partirebbero" }
        }
      }
    ];

    // STRUTTURE PER VERBI SPECIALI (SERVILI, FRASEOLOGICI, PASSIVI, RIFLESSIVI, INDEFINITI)
    const specialStaticDatabase = [
      // SERVILI
      { sentence: "Oggi io **devo terminare** i compiti.", verb: "devo (terminare)", ans: { conjugation: "2a", mode: "indicativo", tense: "presente", person: "1s", transitivity: "transitivo", voice: "attiva", function: "servile" }, tag: "servili" },
      { sentence: "Noi **possiamo superare** ogni difficoltà.", verb: "possiamo (superare)", ans: { conjugation: "2a", mode: "indicativo", tense: "presente", person: "1p", transitivity: "transitivo", voice: "attiva", function: "servile" }, tag: "servili" },
      { sentence: "Tu **dovresti ascoltare** i consigli.", verb: "dovresti (ascoltare)", ans: { conjugation: "2a", mode: "condizionale", tense: "presente", person: "2s", transitivity: "transitivo", voice: "attiva", function: "servile" }, tag: "servili" },
      
      // FRASEOLOGICI
      { sentence: "Marco **stava per uscire** quando ha suonato il telefono.", verb: "stava per (uscire)", ans: { conjugation: "1a", mode: "indicativo", tense: "imperfetto", person: "3s", transitivity: "intransitivo", voice: "attiva", function: "fraseologico" }, tag: "servili" },
      { sentence: "Gli studenti **cominciarono a studiare** l'Iliade.", verb: "cominciarono a (studiare)", ans: { conjugation: "1a", mode: "indicativo", tense: "passato remoto", person: "3p", transitivity: "transitivo", voice: "attiva", function: "fraseologico" }, tag: "servili" },
      { sentence: "Noi **continuiamo a lavorare** al progetto.", verb: "continuiamo a (lavorare)", ans: { conjugation: "1a", mode: "indicativo", tense: "presente", person: "1p", transitivity: "intransitivo", voice: "attiva", function: "fraseologico" }, tag: "servili" },

      // PASSIVI
      { sentence: "La mela **è stata mangiata** dal bruco.", verb: "è stata mangiata", ans: { conjugation: "1a", mode: "indicativo", tense: "passato prossimo", person: "3s", transitivity: "transitivo", voice: "passiva", function: "proprio" }, tag: "passivi" },
      { sentence: "I dipinti **furono premiati** dalla giuria.", verb: "furono premiati", ans: { conjugation: "1a", mode: "indicativo", tense: "trapassato remoto", person: "3p", transitivity: "transitivo", voice: "passiva", function: "proprio" }, tag: "passivi" },
      { sentence: "La lezione **verrà spiegata** domani.", verb: "verrà spiegata", ans: { conjugation: "1a", mode: "indicativo", tense: "futuro semplice", person: "3s", transitivity: "transitivo", voice: "passiva", function: "proprio" }, tag: "passivi" },

      // RIFLESSIVI
      { sentence: "Ogni mattina Luigi **si lava** con acqua fredda.", verb: "si lava", ans: { conjugation: "1a", mode: "indicativo", tense: "presente", person: "3s", transitivity: "transitivo", voice: "riflessiva", function: "proprio" }, tag: "passivi" },
      { sentence: "Noi **ci prepariamo** per la gara sportiva.", verb: "ci prepariamo", ans: { conjugation: "1a", mode: "indicativo", tense: "presente", person: "1p", transitivity: "transitivo", voice: "riflessiva", function: "proprio" }, tag: "passivi" },

      // MODI INDEFINITI & TEMPI COMPOSTI
      { sentence: "**Avendo finito** i compiti, uscii a giocare.", verb: "avendo finito", ans: { conjugation: "3a", mode: "gerundio", tense: "passato", person: "nessuna", transitivity: "transitivo", voice: "attiva", function: "proprio" }, tag: "composti" },
      { sentence: "È importante **aver compreso** la lezione.", verb: "aver compreso", ans: { conjugation: "2a", mode: "infinito", tense: "passato", person: "nessuna", transitivity: "transitivo", voice: "attiva", function: "proprio" }, tag: "composti" },
      { sentence: "Il compito **svolto** da Paolo era perfetto.", verb: "svolto", ans: { conjugation: "2a", mode: "participio", tense: "passato", person: "nessuna", transitivity: "transitivo", voice: "attiva", function: "proprio" }, tag: "composti" },
      { sentence: "**Ascoltando** la musica, mi rilasso.", verb: "ascoltando", ans: { conjugation: "1a", mode: "gerundio", tense: "presente", person: "nessuna", transitivity: "transitivo", voice: "attiva", function: "proprio" }, tag: "composti" }
    ];

    // Mappa codici tempi
    const tenseNameMap = {
      pres: { m: "indicativo", t: "presente" },
      imp: { m: "indicativo", t: "imperfetto" },
      passRem: { m: "indicativo", t: "passato remoto" },
      futSimp: { m: "indicativo", t: "futuro semplice" },
      passPross: { m: "indicativo", t: "passato prossimo" },
      trapPross: { m: "indicativo", t: "trapassato prossimo" },
      futAnt: { m: "indicativo", t: "futuro anteriore" },
      congPres: { m: "congiuntivo", t: "presente" },
      condPres: { m: "condizionale", t: "presente" }
    };

    // GENERATORE COMBINATORIO DINAMICO
    function generateSingleExercise(filter = "all") {
      // Se si filtra per categorie speciali, usa gli elementi statici dedicati
      if (filter === "servili" || filter === "passivi") {
        const filtered = specialStaticDatabase.filter(item => item.tag === filter);
        return filtered[Math.floor(Math.random() * filtered.length)];
      }

      if (filter === "composti" && Math.random() < 0.5) {
        const filtered = specialStaticDatabase.filter(item => item.tag === "composti");
        return filtered[Math.floor(Math.random() * filtered.length)];
      }

      // 25% probabilità di selezionare una struttura speciale in modalità "all"
      if (filter === "all" && Math.random() < 0.3) {
        return specialStaticDatabase[Math.floor(Math.random() * specialStaticDatabase.length)];
      }

      // Estrazione combinatoria globale
      const subj = subjects[Math.floor(Math.random() * subjects.length)];
      const vb = verbBaseDatabase[Math.floor(Math.random() * verbBaseDatabase.length)];
      const obj = vb.obj[Math.floor(Math.random() * vb.obj.length)];
      
      const tenseKeys = Object.keys(tenseNameMap);
      const chosenTenseKey = tenseKeys[Math.floor(Math.random() * tenseKeys.length)];
      const tenseData = tenseNameMap[chosenTenseKey];

      const verbForm = vb.forms[subj.p][chosenTenseKey];
      
      let sentence = "";
      if (tenseData.m === "congiuntivo") {
        sentence = `Spero che ${subj.text} **${verbForm}** ${obj}.`;
      } else {
        sentence = `${subj.text} **${verbForm}** ${obj}.`;
      }

      return {
        sentence: sentence,
        verb: verbForm,
        ans: {
          conjugation: vb.conj,
          mode: tenseData.m,
          tense: tenseData.t,
          person: subj.p,
          transitivity: vb.trans,
          voice: "attiva",
          function: "proprio"
        }
      };
    }

    // STATO APPLICAZIONE
    let currentExercise = null;
    let score = 0;
    let streak = 0;
    let currentStep = 1;
    const totalSteps = 10;

    function loadExercise() {
      const filter = document.getElementById('mode-filter').value;
      currentExercise = generateSingleExercise(filter);

      // Formattazione testo evidenziato
      const formatted = currentExercise.sentence.replace(/\*\*(.*?)\*\*/g, '<span class="text-brand-purple underline font-extrabold">$1</span>');
      document.getElementById('sentence-text').innerHTML = formatted;
      document.getElementById('target-verb-text').textContent = currentExercise.verb;

      // Reset Form UI
      document.getElementById('analysis-form').reset();
      enableInputs(true);

      document.getElementById('current-step').textContent = currentStep;
      document.getElementById('total-steps').textContent = totalSteps;

      document.getElementById('btn-submit').classList.remove('hidden');
      document.getElementById('btn-next').classList.add('hidden');
      document.getElementById('feedback-panel').classList.add('hidden');
    }

    function enableInputs(enable) {
      const selects = document.querySelectorAll('#analysis-form select');
      selects.forEach(s => s.disabled = !enable);
    }

    function handleModeChange() {
      const modeVal = document.getElementById('mode').value;
      const personSelect = document.getElementById('person');

      if (['infinito', 'participio', 'gerundio'].includes(modeVal)) {
        personSelect.value = 'nessuna';
        personSelect.disabled = true;
      } else {
        personSelect.disabled = false;
      }
    }

    function checkAnswer(e) {
      e.preventDefault();

      const user = {
        conjugation: document.getElementById('conjugation').value,
        mode: document.getElementById('mode').value,
        tense: document.getElementById('tense').value,
        person: document.getElementById('person').value,
        transitivity: document.getElementById('transitivity').value,
        voice: document.getElementById('voice').value,
        function: document.getElementById('function').value
      };

      const correct = currentExercise.ans;
      const errors = [];

      const labels = {
        conjugation: "Coniugazione",
        mode: "Modo",
        tense: "Tempo",
        person: "Persona",
        transitivity: "Transitività",
        voice: "Forma",
        function: "Funzione/Uso"
      };

      for (let key in correct) {
        if (user[key] !== correct[key]) {
          const opt = document.querySelector(`#${key} option[value="${correct[key]}"]`);
          const correctLabel = opt ? opt.textContent : correct[key];
          errors.push({ field: labels[key], expected: correctLabel });
        }
      }

      enableInputs(false);
      document.getElementById('btn-submit').classList.add('hidden');
      document.getElementById('btn-next').classList.remove('hidden');

      const panel = document.getElementById('feedback-panel');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');
      const body = document.getElementById('feedback-body');

      panel.classList.remove('hidden', 'bg-emerald-950/80', 'border-emerald-500', 'bg-rose-950/80', 'border-rose-500');

      if (errors.length === 0) {
        streak++;
        score += 10 + (streak * 2);
        
        panel.classList.add('bg-emerald-950/80', 'border-emerald-500');
        icon.innerHTML = '🎉';
        title.className = 'text-lg font-bold text-emerald-300';
        title.textContent = 'ECCELLENTE! Risposta Corretta!';
        body.innerHTML = `<p class="text-emerald-200">Hai identificato con precisione tutte le proprietà grammaticali di <strong>"${currentExercise.verb}"</strong>.</p>`;
      } else {
        streak = 0;
        panel.classList.add('bg-rose-950/80', 'border-rose-500');
        icon.innerHTML = '❌';
        title.className = 'text-lg font-bold text-rose-300';
        title.textContent = `Ci sono ${errors.length} error${errors.length > 1 ? 'i' : 'o'}:`;

        let listHtml = '<ul class="list-disc pl-5 text-rose-200 space-y-1">';
        errors.forEach(err => {
          listHtml += `<li><strong>${err.field}</strong>: corretto ➔ <em>${err.expected}</em></li>`;
        });
        listHtml += '</ul>';
        body.innerHTML = listHtml;
      }

      updateStats();
    }

    function updateStats() {
      document.getElementById('score-display').textContent = score;
      document.getElementById('streak-display').textContent = `🔥 ${streak}`;

      const levelEl = document.getElementById('level-display');
      if (score >= 120) levelEl.textContent = '👑 Leggenda';
      else if (score >= 80) levelEl.textContent = '⚡ Esperto';
      else if (score >= 40) levelEl.textContent = '📚 Apprendista';
      else levelEl.textContent = '🌱 Novizio';
    }

    function nextQuestion() {
      if (currentStep < totalSteps) {
        currentStep++;
        loadExercise();
      } else {
        // Schermata finale
        document.querySelector('main').innerHTML = `
          <div class="glass-card rounded-3xl p-8 text-center border border-slate-700">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-extrabold font-display text-brand-purple mb-2">Esercitazione Completata!</h2>
            <p class="text-slate-300 mb-6">Hai completato la sessione di allenamento di analisi grammaticale.</p>
            
            <div class="inline-block p-6 bg-slate-900/80 rounded-2xl border border-slate-700 mb-8">
              <span class="block text-xs uppercase font-bold text-slate-400">Punteggio Finale</span>
              <span class="text-5xl font-extrabold font-display text-brand-orange">${score}</span>
            </div>

            <div>
              <button onclick="location.reload()" class="w-full py-4 bg-gradient-to-r from-brand-blue to-brand-purple text-white font-extrabold text-lg rounded-2xl shadow-lg glow-purple font-display">
                NUOVA SESSIONE CON NUOVI VERBI 🔄
              </button>
            </div>
          </div>
        `;
      }
    }

    function resetGame() {
      score = 0;
      streak = 0;
      currentStep = 1;
      updateStats();
      loadExercise();
    }

    // Avvio al caricamento
    window.onload = function() {
      loadExercise();
    };
  </script>
</body>
</html>
